[package]
name = "engram-mcp"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "OAuth 2.1 MCP server for a local Markdown knowledge base with scoped inbox note creation"
license = "MIT"

[dependencies]
anyhow = "1.0"
axum = "0.8"
base64 = "0.22"
dotenvy = "0.15"
getrandom = "0.3"
hmac = "0.12"
ignore = "0.4"
rmcp = { version = "=3.1.2", features = ["transport-streamable-http-server", "tower"] }
rustix = { version = "1.1", features = ["fs"] }
schemars = "1.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
sha2 = "0.10"
subtle = "2.6"
thiserror = "2.0"
tokio = { version = "1.48", features = ["macros", "net", "rt-multi-thread", "signal", "sync"] }
tower = { version = "0.5", features = ["limit", "util"] }
tower-http = { version = "0.6", features = ["limit"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
url = "2.5"

[dev-dependencies]
tempfile = "3.23"
